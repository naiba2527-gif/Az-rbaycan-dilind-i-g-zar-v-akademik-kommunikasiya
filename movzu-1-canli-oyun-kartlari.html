<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mövzu 1 | Canlı Oyun Kartları</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e0f2fe,#f5f3ff,#ecfdf5);min-height:100vh;color:#172033}
header{text-align:center;padding:28px 16px 10px}h1{margin:0;font-size:clamp(24px,4vw,40px)}.sub{margin:10px auto;max-width:850px;color:#4b5563}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px}.badge{background:#fff;padding:10px 18px;border-radius:999px;box-shadow:0 5px 18px #0001;font-weight:bold}
.game{max-width:820px;margin:10px auto 40px;padding:18px}.progress{height:10px;background:#fff;border-radius:20px;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:10%;background:linear-gradient(90deg,#2563eb,#8b5cf6);transition:.35s}
.card-wrap{perspective:1200px;cursor:pointer}.card{height:410px;position:relative;transform-style:preserve-3d;transition:transform .7s}.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;padding:38px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;box-shadow:0 20px 50px #1e293b25;background:#fff}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#eff6ff,#f5f3ff)}
.icon{font-size:54px}.label{font-size:15px;font-weight:bold;color:#6366f1;text-transform:uppercase;letter-spacing:1px}.question{font-size:clamp(23px,3.2vw,34px);line-height:1.35;font-weight:700;margin:18px 0}.hint{color:#64748b}
.answer{font-size:clamp(20px,2.8vw,30px);font-weight:700;line-height:1.45}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:600px;margin-top:15px}.option{border:2px solid #e5e7eb;background:#fff;border-radius:14px;padding:13px;font-size:16px;cursor:pointer}.option:hover{border-color:#6366f1}.option.correct{background:#dcfce7;border-color:#22c55e}.option.wrong{background:#fee2e2;border-color:#ef4444}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}button.ctrl{border:0;border-radius:14px;padding:13px 22px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}button.ctrl.secondary{background:#fff;color:#2563eb;border:2px solid #2563eb}.footer{text-align:center;color:#64748b;font-size:14px;margin-top:18px}
@media(max-width:600px){.card{height:480px}.face{padding:25px}.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>🎴 Mövzu 1: Canlı Oyun Kartları</h1>
<p class="sub">“Azərbaycan dilində işgüzar və akademik kommunikasiya” fənni, predmeti, məqsədi və vəzifələri</p>
<div class="stats"><div class="badge" id="counter">Kart: 1 / 10</div><div class="badge" id="score">🏆 Xal: 0</div></div>
</header>
<main class="game">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card-wrap" id="cardWrap">
<div class="card" id="card">
<div class="face front"><div class="icon" id="icon">🎯</div><div class="label" id="label">Sual kartı</div><div class="question" id="question"></div><div class="options" id="options"></div><div class="hint" id="hint">Cavabı görmək üçün karta klik edin.</div></div>
<div class="face back"><div class="icon">✅</div><div class="label">Düzgün cavab</div><div class="answer" id="answer"></div><div class="hint">Kartı yenidən çevirmək üçün klik edin.</div></div>
</div>
</div>
<div class="controls">
<button class="ctrl secondary" onclick="prev()">← Əvvəlki</button>
<button class="ctrl" onclick="flipCard()">🔄 Cavabı göstər</button>
<button class="ctrl secondary" onclick="next()">Növbəti →</button>
<button class="ctrl secondary" onclick="resetGame()">↻ Yenidən başla</button>
</div>
<div class="footer">Düzgün cavab seçdikdə 1 xal qazanırsınız.</div>
</main>
<script>
const cards=[
{icon:"🏢",label:"Kart 1 | İşgüzar kommunikasiya",q:"İşgüzar kommunikasiya əsasən hansı sahədə mühüm rol oynayır?",o:["İdarə və təşkilatlarda əlaqələrin qurulmasında","Yalnız bədii əsərlərdə","Yalnız idmanda"],c:0,a:"İşgüzar kommunikasiya idarə və təşkilatlarda səmərəli əlaqə və informasiya mübadiləsini təmin edir."},
{icon:"🔬",label:"Kart 2 | Doğru və ya yanlış",q:"Akademik kommunikasiya elmi araşdırmaların və elmi fikirlərin yayılmasına xidmət edir.",o:["Doğru","Yanlış"],c:0,a:"Doğru. Akademik kommunikasiya elmi biliklərin paylaşılması və inkişafında mühüm rol oynayır."},
{icon:"⚖️",label:"Kart 3 | Fərqi tap",q:"İşgüzar və akademik kommunikasiyanı düzgün uyğunlaşdırın.",o:["İşgüzar: sənədlər, yazışmalar | Akademik: elmi araşdırma","İşgüzar: yalnız şeir | Akademik: yalnız reklam"],c:0,a:"İşgüzar kommunikasiya sənədləşmə və idarəetmə ilə, akademik kommunikasiya isə elmi araşdırma və akademik yazı ilə bağlıdır."},
{icon:"📚",label:"Kart 4 | Fənnin vəzifəsi",q:"Aşağıdakılardan hansı fənnin vəzifələrindən biridir?",o:["Orfoqrafiya və orfoepiya qaydalarını öyrənmək","Yalnız riyazi düsturlar əzbərləmək","Yalnız xarici dil öyrənmək"],c:0,a:"Fənnin mühüm vəzifələrindən biri orfoqrafiya və orfoepiya qaydalarını mənimsətməkdir."},
{icon:"📁",label:"Kart 5 | Predmeti müəyyən et",q:"Fənnin predmetinə əsasən hansı sahə daxildir?",o:["Sənəd işlərinin aparılması, nizamlanması və saxlanılması","Yalnız musiqi alətlərinin öyrənilməsi","Yalnız idman qaydaları"],c:0,a:"Fənnin predmetinə sənəd işlərinin aparılması, nizamlanması, istifadəsi və saxlanılması daxildir."},
{icon:"🎯",label:"Kart 6 | Məqsədi tap",q:"Fənnin əsas məqsədlərindən biri hansıdır?",o:["Sənədlərin hazırlanması və sənəd dövriyyəsini öyrətmək","Yalnız imtahan sualları əzbərlətmək","Yalnız bədii mətn yazdırmaq"],c:0,a:"Fənnin məqsədi sənədlərin hazırlanması yollarını və sənəd dövriyyəsinin təşkilini öyrətməkdir."},
{icon:"📝",label:"Kart 7 | Hansı sənəddir?",q:"Aşağıdakılardan hansıları işgüzar sənəd nümunələridir?",o:["Ərizə, izahat və arayış","Roman, poema və hekayə","Mahnı, rəqs və film"],c:0,a:"Ərizə, izahat və arayış işgüzar sənəd nümunələridir."},
{icon:"🗣️",label:"Kart 8 | Bacarıqları tanı",q:"Fənnin tədrisində hansı bacarıqlar formalaşdırılır?",o:["Yazılı və şifahi kommunikasiya, verbal və qeyri-verbal ünsiyyət","Yalnız sürətli yazmaq","Yalnız xarici sözlər əzbərləmək"],c:0,a:"Fənn yazılı və şifahi kommunikasiya, verbal və qeyri-verbal ünsiyyət, işgüzar yazı və etik davranış bacarıqlarını inkişaf etdirir."},
{icon:"🎓",label:"Kart 9 | Akademik yazı",q:"Aşağıdakılardan hansıları akademik yazı nümunələridir?",o:["Elmi məqalə, dissertasiya, sərbəst iş","Ərizə və arayış","Reklam şüarı"],c:0,a:"Elmi məqalə, dissertasiya və sərbəst iş akademik yazı nümunələridir."},
{icon:"💬",label:"Kart 10 | Bonus müzakirə",q:"Kommunikasiya qurmaq bacarığı bu gün cəmiyyətdə nə üçün aparıcı rol oynayır?",o:["İnformasiya mübadiləsini və əməkdaşlığı gücləndirir","Heç bir əhəmiyyəti yoxdur"],c:0,a:"Düzgün kommunikasiya informasiya mübadiləsini, əməkdaşlığı, qərar qəbulunu və problemlərin səmərəli həllini təmin edir."}
];
let i=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
answered=false;$("card").classList.remove("flipped");let x=cards[i];
$("icon").textContent=x.icon;$("label").textContent=x.label;$("question").textContent=x.q;$("answer").textContent=x.a;$("counter").textContent=`Kart: ${i+1} / ${cards.length}`;$("score").textContent=`🏆 Xal: ${score}`;$("bar").style.width=`${(i+1)/cards.length*100}%`;
$("options").innerHTML="";x.o.forEach((v,n)=>{let b=document.createElement("button");b.className="option";b.textContent=v;b.onclick=e=>{e.stopPropagation();choose(n,b)};$("options").appendChild(b)});
}
function choose(n,b){if(answered)return;answered=true;let x=cards[i],bs=[...document.querySelectorAll(".option")];bs.forEach((z,k)=>{z.disabled=true;if(k===x.c)z.classList.add("correct")});if(n===x.c){score++;$("score").textContent=`🏆 Xal: ${score}`}else b.classList.add("wrong");setTimeout(flipCard,700)}
function flipCard(){$("card").classList.toggle("flipped")}
$("cardWrap").onclick=e=>{if(!e.target.classList.contains("option"))flipCard()}
function next(){i=(i+1)%cards.length;render()}function prev(){i=(i-1+cards.length)%cards.length;render()}function resetGame(){i=0;score=0;render()}
render();
</script>
</body>
</html>
