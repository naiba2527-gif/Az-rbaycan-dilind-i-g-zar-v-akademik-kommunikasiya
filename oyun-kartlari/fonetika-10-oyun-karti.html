<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azərbaycan dili | Fonetika | Canlı Oyun Kartları</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef4ff,#fff5e8);color:#17324d}.wrap{max-width:980px;margin:auto;padding:22px 16px 40px}header{background:#fff;border-radius:28px;padding:24px;text-align:center;box-shadow:0 12px 35px #17324d18}h1{font-size:clamp(28px,5vw,46px);margin:8px 0}.badge{display:inline-block;background:#e8ddff;color:#6334a5;padding:8px 15px;border-radius:99px;font-weight:800}.sub{color:#607080;margin:0}.bar{display:flex;gap:12px;align-items:center;margin:18px 0}.progress{flex:1;height:13px;background:#e2e9f1;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#7048c9,#0aa69a,#f39a35);transition:.4s}.score,.timer{padding:10px 15px;border-radius:14px;font-weight:800;color:#fff;background:#17324d;white-space:nowrap}.timer{background:#e65100}.card{background:#fff;border-radius:30px;padding:30px;min-height:520px;box-shadow:0 18px 45px #17324d1a;border-top:9px solid var(--c);position:relative;overflow:hidden}.card:after{content:'🎵';position:absolute;right:25px;top:20px;font-size:45px;opacity:.1}.head{display:flex;align-items:center;gap:14px}.num{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:26px;font-weight:900}.type{color:var(--c);font-weight:900;text-transform:uppercase;letter-spacing:.8px}.q{font-size:21px;line-height:1.55;margin:26px 0 22px}.opts{display:grid;gap:12px}.opt{border:2px solid #e1e8ef;background:#fff;border-radius:17px;padding:16px 18px;text-align:left;font-size:17px;cursor:pointer;transition:.18s}.opt:hover{transform:translateY(-2px);border-color:var(--c)}.opt.ok{background:#eaf8ee;border-color:#45a85a}.opt.no{background:#fff0f0;border-color:#dc6262}.feed{display:none;margin-top:17px;padding:16px;border-radius:15px;background:#f2f6fa;line-height:1.55}.feed.show{display:block}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:23px}.btn{border:0;border-radius:14px;padding:13px 21px;font-size:16px;font-weight:800;cursor:pointer;background:var(--c);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:14px;color:#6b7785}.finish{text-align:center}.trophy{font-size:78px}.result{font-size:28px;font-weight:900}.restart{background:#17324d}.note{margin-top:18px;background:#fff;border-radius:18px;padding:15px;text-align:center;color:#596b7c;box-shadow:0 8px 25px #17324d0c}.savebox{margin-top:22px;background:#f7f9fc;border-radius:20px;padding:18px;text-align:left}.savebox input{width:100%;padding:13px;border:2px solid #dce4ed;border-radius:12px;font-size:16px;margin:8px 0 12px}.saved{margin-top:18px;padding:15px;border-radius:14px;background:#edf8f0}.results{margin-top:18px}.results table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}.results th,.results td{padding:9px;border-bottom:1px solid #e8edf2;text-align:left}.smallbtn{padding:9px 12px;font-size:14px}.danger{background:#b42318}@media(max-width:650px){.bar{flex-direction:column;align-items:stretch}.score,.timer{text-align:center}.card{padding:23px;min-height:570px}.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
<span class="badge">📚 Azərbaycan dili</span>
<h1>🎴 Fonetika</h1>
<p class="sub">10 canlı oyun kartı • Cavab ver • Xal qazan • Fonetikanı möhkəmləndir</p>
</header>
<div class="bar"><div class="progress"><div id="fill" class="fill"></div></div><div class="score">🏆 Xal: <span id="score">0</span></div><div class="timer">⏱️ <span id="timer">20</span>s</div></div>
<main id="game"></main>
<div class="note">💡 Qayda: Hər düzgün cavab 10 xal. Hər kart üçün 20 saniyə. Vaxt bitərsə növbəti karta keçə bilərsiniz.</div>
</div>
<script>
const cards=[
{t:'Səs və hərf',c:'#6c3eb8',q:'Sözün tələffüzündə eşidilən ən kiçik dil vahidi hansıdır?',o:['Səs','Hərf','Heca','Cümlə'],a:0,e:'Səs eşidilir və tələffüz olunur. Hərf isə səsi yazıda ifadə edən işarədir.'},
{t:'Sait ovçusu',c:'#00897b',q:'Hansı sırada yalnız sait səslər verilib?',o:['a, ə, e','b, d, g','m, n, r','k, a, t'],a:0,e:'a, ə, e sait səslərdir. Digər variantlarda samit səslər də var.'},
{t:'Samit tap',c:'#1976d2',q:'“Kitab” sözündə neçə samit səs var?',o:['2','3','4','5'],a:1,e:'Kitab sözündə k, t, b olmaqla 3 samit səs var.'},
{t:'Heca ustası',c:'#f57c00',q:'“Məktəb” sözü neçə hecadan ibarətdir?',o:['1','2','3','4'],a:1,e:'Mək-təb. Söz 2 hecadan ibarətdir.'},
{t:'Ahəng qanunu',c:'#d6336c',q:'Hansı söz ahəng qanununa uyğundur?',o:['kitab','qələm','çiçək','saat'],a:2,e:'“Çiçək” sözündə saitlər incədir: i və ə.'},
{t:'Saitin xüsusiyyəti',c:'#2e7d32',q:'“Ü” səsi hansı xüsusiyyətə malikdir?',o:['İncə, dodaqlanan sait','Qalın, dodaqlanmayan sait','Qalın, dodaqlanan sait','Samit'],a:0,e:'Ü incə və dodaqlanan saitdir.'},
{t:'Samitin xüsusiyyəti',c:'#3949ab',q:'“M” səsi hansı qrupa daxildir?',o:['Sait','Samit','Heca','Vurğu'],a:1,e:'M samit səsdir. Tələffüz zamanı hava axını maneə ilə qarşılaşır.'},
{t:'Doğru, yoxsa yanlış?',c:'#00838f',q:'Hərf və səs həmişə eyni şeydir.',o:['Doğru','Yanlış'],a:1,e:'Yanlışdır. Səs eşidilir, hərf isə səsi yazıda ifadə edir.'},
{t:'Səs tərkibi',c:'#8e44ad',q:'“Ana” sözündə neçə səs var?',o:['2','3','4','5'],a:1,e:'Ana sözündə a-n-a olmaqla 3 səs var.'},
{t:'Fonetika nəyi öyrənir?',c:'#e65100',q:'Fonetika əsasən nəyi öyrənir?',o:['Dil səslərini və onların xüsusiyyətlərini','Cümlələrin quruluşunu','Sözlərin yalnız mənasını','Mətnin kompozisiyasını'],a:0,e:'Fonetika dil səslərini, onların yaranmasını, tələffüzünü və xüsusiyyətlərini öyrənən dilçilik bölməsidir.'}
];
let i=0,score=0,answered=false,time=20,timerId;
const game=document.getElementById('game');
function render(){clearInterval(timerId);if(i===cards.length){finish();return}answered=false;time=20;document.getElementById('timer').textContent=time;const x=cards[i];document.getElementById('fill').style.width=((i+1)/cards.length*100)+'%';game.innerHTML=`<section class="card" style="--c:${x.c}"><div class="head"><div class="num">${i+1}</div><div class="type">${x.t}</div></div><h2>Oyun kartı ${i+1}</h2><div class="q">${x.q}</div><div class="opts">${x.o.map((v,n)=>`<button class="opt" onclick="answer(${n})">${String.fromCharCode(65+n)}) ${v}</button>`).join('')}</div><div id="feed" class="feed"></div><div class="actions"><span class="hint">Düzgün cavab: +10 xal</span><button id="next" class="btn" disabled onclick="next()">Növbəti kart ➜</button></div></section>`;timerId=setInterval(()=>{time--;document.getElementById('timer').textContent=time;if(time<=0){clearInterval(timerId);timeout()}},1000)}
function answer(n){if(answered)return;answered=true;clearInterval(timerId);const x=cards[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===n&&n!==x.a)b.classList.add('no')});const ok=n===x.a;if(ok)score+=10;document.getElementById('score').textContent=score;const f=document.getElementById('feed');f.className='feed show';f.innerHTML=(ok?'🎉 <b>Düzgün cavab!</b> ':'💡 <b>Düzgün cavab seçimi:</b> ')+x.e;document.getElementById('next').disabled=false;if(i===cards.length-1)document.getElementById('next').textContent='Nəticəni gör 🏆'}
function timeout(){if(answered)return;answered=true;const x=cards[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok')});const f=document.getElementById('feed');f.className='feed show';f.innerHTML='⏰ <b>Vaxt bitdi!</b> '+x.e;document.getElementById('next').disabled=false;if(i===cards.length-1)document.getElementById('next').textContent='Nəticəni gör 🏆'}
function next(){i++;render()}
function finish(){clearInterval(timerId);document.getElementById('fill').style.width='100%';document.getElementById('timer').textContent='✓';const key='fonetikaNəticələri';let old=[];try{old=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};game.innerHTML=`<section class="card finish" style="--c:#6c3eb8"><div class="trophy">🏆</div><h2>Oyun tamamlandı!</h2><p class="result">${score} / 100 xal</p><p>${score===100?'🌟 Mükəmməl! Fonetika üzrə bütün kartları düzgün cavablandırdınız!':score>=70?'👏 Çox yaxşı nəticə! Fonetikanın əsas anlayışlarını yaxşı mənimsəmisiniz.':'💪 Yaxşı başlanğıcdır! Yenidən oynayın və nəticənizi yüksəldin.'}</p><div class="savebox"><b>👤 Nəticəni yadda saxla</b><input id="studentName" placeholder="Şagirdin adı və soyadı"><button class="btn" onclick="saveResult()">💾 Yadda saxla</button><div id="saveMsg"></div></div><div class="results"><button class="btn smallbtn" onclick="showResults()">📋 Saxlanılan nəticələr</button><div id="resultList"></div></div><br><button class="btn restart" onclick="restart()">🔄 Yenidən oyna</button></section>`}
function saveResult(){const name=document.getElementById('studentName').value.trim();const msg=document.getElementById('saveMsg');if(!name){msg.innerHTML='<p style="color:#b42318">⚠️ Əvvəlcə ad və soyadı yazın.</p>';return}const key='fonetikaNəticələri';let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};arr.push({name:name,score:score,date:new Date().toLocaleString('az-AZ')});localStorage.setItem(key,JSON.stringify(arr));msg.innerHTML='<div class="saved">✅ Nəticə yadda saxlanıldı!</div>';document.getElementById('studentName').value=''}
function showResults(){const key='fonetikaNəticələri';let arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){};const box=document.getElementById('resultList');if(!arr.length){box.innerHTML='<p>Hələ saxlanılmış nəticə yoxdur.</p>';return}box.innerHTML='<div class="saved"><b>📊 Nəticələr</b>'+arr.map((r,n)=>`<p>${n+1}. ${r.name} | <b>${r.score}/100</b> | ${r.date}</p>`).join('')+'<button class="btn smallbtn danger" onclick="clearResults()">🗑️ Bütün nəticələri sil</button></div>'}
function clearResults(){if(confirm('Bütün saxlanılan nəticələr silinsin?')){localStorage.removeItem('fonetikaNəticələri');showResults()}}
function restart(){i=0;score=0;document.getElementById('score').textContent=0;render()}
render();
</script>
</body>
</html>
