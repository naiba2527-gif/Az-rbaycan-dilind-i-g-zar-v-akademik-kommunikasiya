<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonetika | 10 Canlı Oyun Kartı</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#fff7ec);color:#18324a}.wrap{max-width:950px;margin:auto;padding:24px 16px 40px}header{background:#fff;border-radius:26px;padding:24px;text-align:center;box-shadow:0 12px 35px #16324a18}h1{margin:8px 0;font-size:clamp(28px,5vw,44px)}header p{margin:0;color:#607080}.badge{display:inline-block;background:#e9ddff;color:#6334a5;padding:7px 14px;border-radius:30px;font-weight:bold}.bar{display:flex;gap:12px;align-items:center;margin:18px 0}.progress{height:12px;flex:1;background:#e3eaf2;border-radius:20px;overflow:hidden}.fill{height:100%;width:10%;background:linear-gradient(90deg,#7050d9,#16a6a0,#f39a35);transition:.35s}.score{background:#18324a;color:#fff;padding:10px 16px;border-radius:14px;font-weight:bold}.card{background:#fff;border-radius:30px;padding:30px;min-height:510px;box-shadow:0 18px 45px #16324a1a;border-top:9px solid var(--c)}.head{display:flex;gap:14px;align-items:center}.num{width:58px;height:58px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:800}.type{color:var(--c);font-weight:800;text-transform:uppercase;letter-spacing:.8px}h2{font-size:30px;margin:25px 0 12px}.q{font-size:20px;line-height:1.5;margin-bottom:22px}.opts{display:grid;gap:11px}.opt{border:2px solid #e1e8ef;background:#fff;border-radius:16px;padding:16px;text-align:left;font-size:17px;cursor:pointer}.opt:hover{border-color:var(--c);transform:translateY(-1px)}.opt.ok{background:#eaf8ee;border-color:#46a35a}.opt.no{background:#fff0f0;border-color:#db6262}.feed{display:none;margin-top:16px;padding:15px;border-radius:14px;background:#f1f6fa;line-height:1.5}.feed.show{display:block}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px}.btn{border:0;border-radius:14px;padding:13px 20px;font-size:16px;font-weight:bold;cursor:pointer;background:var(--c);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.small{font-size:14px;color:#6c7783}.finish{text-align:center}.trophy{font-size:75px}.result{font-size:25px;font-weight:bold}footer{text-align:center;color:#71808e;margin-top:16px;font-size:13px}@media(max-width:600px){.card{padding:22px;min-height:560px}.bar{flex-direction:column;align-items:stretch}.score{text-align:center}}
</style>
</head>
<body>
<div class="wrap">
<header><span class="badge">📚 Azərbaycan dili</span><h1>Fonetika</h1><p>10 canlı oyun kartı • Cavab ver • Xal topla • Öyrən</p></header>
<div class="bar"><div class="progress"><div id="fill" class="fill"></div></div><div class="score">🏆 Xal: <span id="score">0</span></div></div>
<main id="game"></main><footer>Fonetika üzrə interaktiv tədris oyunu</footer>
</div>
<script>
const cards=[
{t:'Səs və hərf',c:'#6c3eb8',q:'Sözün səslənməsini yaradan, eşidilən ən kiçik dil vahidi hansıdır?',o:['Səs','Hərf','Heca'],a:0,e:'Səs danışıq zamanı eşidilən dil vahididir. Hərf isə səsi yazıda ifadə edir.'},
{t:'Saitləri tap',c:'#00897b',q:'Hansı sırada yalnız sait səslər verilib?',o:['a, ə, e','b, d, g','m, n, r'],a:0,e:'a, ə, e sait səslərdir. Digər variantlarda samitlər üstünlük təşkil edir.'},
{t:'Samiti seç',c:'#1976d2',q:'“Kitab” sözündə neçə samit səs var?',o:['2','3','4'],a:1,e:'Kitab sözündə k, t, b olmaqla 3 samit səs var.'},
{t:'Heca ustası',c:'#f57c00',q:'“Məktəb” sözü neçə hecadan ibarətdir?',o:['1','2','3'],a:1,e:'Mək-təb: söz 2 hecadan ibarətdir.'},
{t:'Ahəng qanunu',c:'#d6336c',q:'Hansı söz ahəng qanununa uyğundur?',o:['kitab','qələm','çiçək'],a:2,e:'“Çiçək” sözündə saitlər e və ə-dir, hər ikisi incə saitdir.'},
{t:'Saitin növünü tap',c:'#2e7d32',q:'“Ü” səsi hansı xüsusiyyətə malikdir?',o:['İncə, dodaqlanan sait','Qalın, dodaqlanmayan sait','Samit'],a:0,e:'Ü incə və dodaqlanan saitdir.'},
{t:'Samitin xüsusiyyəti',c:'#3949ab',q:'“M” səsi hansı nitq səsi qrupuna daxildir?',o:['Sait','Samit','Heca'],a:1,e:'M samit səsdir. Saitlərdən fərqli olaraq tələffüz zamanı hava axını maneə ilə qarşılaşır.'},
{t:'Doğru, yoxsa yanlış?',c:'#00838f',q:'Hərf və səs həmişə eyni şeydir.',o:['Doğru','Yanlış'],a:1,e:'Yanlışdır. Səs eşidilir və tələffüz olunur, hərf isə səsi yazıda göstərir.'},
{t:'Sözün səs tərkibi',c:'#8e44ad',q:'“Ana” sözündə neçə səs var?',o:['2','3','4'],a:1,e:'Ana sözündə a-n-a olmaqla 3 səs var.'},
{t:'Final çağırışı',c:'#e65100',q:'Fonetika əsasən nəyi öyrənir?',o:['Dil səslərini və onların xüsusiyyətlərini','Cümlələrin quruluşunu','Sözlərin yalnız mənasını'],a:0,e:'Fonetika dilin səslərini, onların yaranmasını, tələffüzünü və xüsusiyyətlərini öyrənən dilçilik bölməsidir.'}
];
let i=0,score=0,answered=false;const game=document.getElementById('game');
function render(){if(i===cards.length){finish();return}answered=false;let x=cards[i];document.getElementById('fill').style.width=((i+1)/cards.length*100)+'%';game.innerHTML=`<section class="card" style="--c:${x.c}"><div class="head"><div class="num">${i+1}</div><div class="type">${x.t}</div></div><h2>🎴 Oyun kartı ${i+1}</h2><div class="q">${x.q}</div><div class="opts">${x.o.map((v,n)=>`<button class="opt" onclick="answer(${n})">${String.fromCharCode(65+n)}) ${v}</button>`).join('')}</div><div id="feed" class="feed"></div><div class="actions"><span class="small">Düzgün cavab: +10 xal</span><button id="next" class="btn" disabled onclick="next()">Növbəti kart ➜</button></div></section>`}
function answer(n){if(answered)return;answered=true;let x=cards[i],bs=[...document.querySelectorAll('.opt')];bs.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('ok');if(k===n&&n!==x.a)b.classList.add('no')});let ok=n===x.a;if(ok)score+=10;document.getElementById('score').textContent=score;let f=document.getElementById('feed');f.className='feed show';f.innerHTML=(ok?'🎉 <b>Düzgün cavab!</b> ':'💡 <b>Doğru cavab:</b> ')+x.e;document.getElementById('next').disabled=false;if(i===cards.length-1)document.getElementById('next').textContent='Nəticəni gör 🏆'}
function next(){i++;render()}
function finish(){game.innerHTML=`<section class="card finish" style="--c:#6c3eb8"><div class="trophy">🏆</div><h2>Oyun tamamlandı!</h2><p class="result">${score} / 100 xal</p><p>${score===100?'Mükəmməl! Fonetika üzrə bütün kartları düzgün cavablandırdınız.':score>=70?'Çox yaxşı nəticə! Fonetika anlayışlarını yaxşı mənimsəmisiniz.':'Yaxşı başlanğıcdır! Oyunu yenidən oynayıb nəticənizi artıra bilərsiniz.'}</p><button class="btn" onclick="restart()">🔄 Yenidən oyna</button></section>`}
function restart(){i=0;score=0;document.getElementById('score').textContent=0;render()}render();
</script>
</body>
</html>
