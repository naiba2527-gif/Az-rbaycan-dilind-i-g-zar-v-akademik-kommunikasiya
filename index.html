<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonetika Testi | Azərbaycan dili</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #ede9fe);
        min-height: 100vh;
        color: #1e293b;
    }

    .container {
        max-width: 850px;
        margin: 40px auto;
        padding: 25px;
    }

    .header {
        background: white;
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        margin-bottom: 25px;
    }

    .header h1 {
        margin: 0 0 10px;
        font-size: 32px;
        color: #4f46e5;
    }

    .header p {
        font-size: 18px;
        margin: 5px;
    }

    .progress {
        background: #e2e8f0;
        height: 12px;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 20px;
    }

    .progress-bar {
        height: 100%;
        width: 0%;
        background: #4f46e5;
        transition: 0.4s;
    }

    .question-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .question-number {
        color: #6366f1;
        font-weight: bold;
        font-size: 17px;
        margin-bottom: 12px;
    }

    .question {
        font-size: 23px;
        font-weight: bold;
        line-height: 1.4;
        margin-bottom: 25px;
    }

    .option {
        display: block;
        background: #f8fafc;
        border: 2px solid #cbd5e1;
        padding: 16px;
        margin: 12px 0;
        border-radius: 12px;
        cursor: pointer;
        font-size: 17px;
        transition: 0.2s;
    }

    .option:hover {
        border-color: #6366f1;
        background: #eef2ff;
    }

    .option input {
        margin-right: 10px;
        transform: scale(1.2);
    }

    .option.correct {
        background: #dcfce7;
        border-color: #16a34a;
    }

    .option.wrong {
        background: #fee2e2;
        border-color: #dc2626;
    }

    button {
        width: 100%;
        padding: 16px;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: #4f46e5;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #4338ca;
    }

    #result {
        display: none;
        background: white;
        border-radius: 20px;
        padding: 35px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    #result h2 {
        color: #4f46e5;
        font-size: 30px;
    }

    .score {
        font-size: 45px;
        font-weight: bold;
        margin: 20px;
        color: #16a34a;
    }

    .message {
        font-size: 20px;
        margin-bottom: 20px;
    }

    .restart {
        background: #16a34a;
    }

    .restart:hover {
        background: #15803d;
    }

    @media(max-width: 600px) {
        .container {
            margin: 15px auto;
            padding: 12px;
        }

        .header h1 {
            font-size: 25px;
        }

        .question {
            font-size: 20px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🔤 FONETİKA TESTİ</h1>
        <p><strong>Azərbaycan dili</strong></p>
        <p>Səslər, saitlər, samitlər və fonetik hadisələr</p>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="question-card" id="quizCard">

        <div class="question-number" id="questionNumber">
            Sual 1 / 10
        </div>

        <div class="question" id="question">
            Fonetika nəyi öyrənir?
        </div>

        <div id="options"></div>

        <button onclick="nextQuestion()" id="nextButton">
            Növbəti sual →
        </button>

    </div>

    <div id="result">
        <h2>🎉 Test başa çatdı!</h2>

        <div class="score" id="score"></div>

        <div class="message" id="message"></div>

        <button class="restart" onclick="restartQuiz()">
            🔄 Testi yenidən başlat
        </button>
    </div>

</div>

<script>

const questions = [

    {
        question: "Fonetika nəyi öyrənir?",
        options: [
            "Sözlərin mənasını",
            "Səsləri və onların xüsusiyyətlərini",
            "Cümlə üzvlərini",
            "Sözlərin quruluşunu"
        ],
        answer: 1
    },

    {
        question: "Azərbaycan əlifbasında neçə hərf var?",
        options: [
            "29",
            "30",
            "32",
            "36"
        ],
        answer: 1
    },

    {
        question: "Azərbaycan dilində neçə sait səs var?",
        options: [
            "6",
            "8",
            "9",
            "10"
        ],
        answer: 2
    },

    {
        question: "Hansı sırada yalnız saitlər verilmişdir?",
        options: [
            "a, ə, ı, i",
            "b, d, g, k",
            "m, n, r, s",
            "q, x, h, c"
        ],
        answer: 0
    },

    {
        question: "Hansı sözün tərkibində 3 sait səs var?",
        options: [
            "kitab",
            "məktəb",
            "Azərbaycan",
            "qələm"
        ],
        answer: 2
    },

    {
        question: "Samit səslər hansı xüsusiyyətə malikdir?",
        options: [
            "Hava axınının maneəsiz keçməsi ilə yaranır",
            "Hava axınının müxtəlif maneələrlə qarşılaşması ilə yaranır",
            "Yalnız yazıda işlənir",
            "Heç vaxt tələffüz olunmur"
        ],
        answer: 1
    },

    {
        question: "Hansı sırada yalnız kar samitlər verilmişdir?",
        options: [
            "b, d, g",
            "p, t, k",
            "m, n, l",
            "z, v, j"
        ],
        answer: 1
    },

    {
        question: "Hansı söz 4 hecalıdır?",
        options: [
            "kitab",
            "məktəb",
            "Azərbaycan",
            "qələm"
        ],
        answer: 2
    },

    {
        question: "Sözün tələffüz zamanı bölündüyü hissələr necə adlanır?",
        options: [
            "Kök",
            "Şəkilçi",
            "Heca",
            "Cümlə"
        ],
        answer: 2
    },

    {
        question: "Hansı sözün ilk səsi saitdir?",
        options: [
            "alma",
            "kitab",
            "məktəb",
            "qələm"
        ],
        answer: 0
    }

];

let currentQuestion = 0;
let score = 0;
let answered = false;

function loadQuestion() {

    answered = false;

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").innerText =
        "Sual " + (currentQuestion + 1) + " / " + questions.length;

    document.getElementById("question").innerText = q.question;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        const label = document.createElement("label");
        label.className = "option";

        label.innerHTML = `
            <input type="radio" name="answer" value="${index}">
            ${option}
        `;

        optionsDiv.appendChild(label);
    });

    document.getElementById("progressBar").style.width =
        ((currentQuestion) / questions.length * 100) + "%";

    document.getElementById("nextButton").innerText =
        currentQuestion === questions.length - 1
        ? "Nəticəni göstər ✓"
        : "Növbəti sual →";
}


function nextQuestion() {

    if (answered) {
        return;
    }

    const selected = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (!selected) {
        alert("Zəhmət olmasa cavablardan birini seçin!");
        return;
    }

    answered = true;

    const selectedAnswer = Number(selected.value);
    const correctAnswer = questions[currentQuestion].answer;

    const options = document.querySelectorAll(".option");

    options.forEach((option, index) => {

        if (index === correctAnswer) {
            option.classList.add("correct");
        }

        if (index === selectedAnswer && selectedAnswer !== correctAnswer) {
            option.classList.add("wrong");
        }
    });

    if (selectedAnswer === correctAnswer) {
        score++;
    }

    setTimeout(() => {

        currentQuestion++;

        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }

    }, 700);
}


function showResult() {

    document.getElementById("quizCard").style.display = "none";
    document.getElementById("result").style.display = "block";

    const percentage = Math.round(
        (score / questions.length) * 100
    );

    document.getElementById("score").innerText =
        score + " / " + questions.length + "  (" + percentage + "%)";

    let message = "";

    if (percentage >= 90) {
        message = "🏆 Əla nəticə! Fonetika mövzusunu çox yaxşı mənimsəmisən.";
    } 
    else if (percentage >= 70) {
        message = "👏 Çox yaxşı! Mövzunu yaxşı bilirsən.";
    } 
    else if (percentage >= 50) {
        message = "👍 Orta nəticə. Bir az təkrar etsən, daha yüksək nəticə əldə edə bilərsən.";
    } 
    else {
        message = "📚 Mövzunu bir daha nəzərdən keçir və testi yenidən yoxla.";
    }

    document.getElementById("message").innerText = message;
}


function restartQuiz() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("quizCard").style.display = "block";
    document.getElementById("result").style.display = "none";

    loadQuestion();
}


loadQuestion();

</script>

</body>
</html>
